    - generic [ref=f6e56]:
      - generic [ref=f6e59]:
        - paragraph [ref=f6e60]: Bowen Lou is an Assistant Professor of Data Sciences and Operations at the Marshall School of Business, University of Southern California. Professor Lou’s research primarily lies in artificial intelligence (AI), innovation and entrepreneurship, and future of work. Broadly, he is extremely passionate about studying emerging technology-enabled phenomena in business, organizations, and society (including but not limited to topics on AI, big data analytics, digital platform, FinTech, healthcare IT, and social media). He works on the new waves of digitization and technological innovation spanning a wide spectrum of industry sectors, by collaborating with leading analytics companies that track technology, labor and innovation trends. Linking macro patterns to micro activities, his studies leverage a variety of interdisciplinary methodologies (including but not limited to econometrics, machine learning, natural language processing, network analytics, game-theoretic modeling, randomized field experiments, and bio/chem-informatics).
        - paragraph [ref=f6e61]
        - paragraph [ref=f6e62]: "Recently his research projects primarily study economics and strategic implications of AI in the following areas:"
        - paragraph [ref=f6e63]:
          - generic [ref=f6e64]:
            - text: 1).
            - emphasis [ref=f6e65]: AI and Digital Transformation in Organizational Innovation (team/firm level)
            - text: ": How AI improves innovation (e.g., patenting and product development), or helps mitigate innovation slowdown during key organizational transitions (e.g., CEO turnover, R&D alliances, disruption in team collaboration),"
        - paragraph [ref=f6e66]:
          - generic [ref=f6e67]:
            - text: 2).
            - emphasis [ref=f6e68]: AI-mediated Digital Platforms as Emerging Organizational Forms (marketplace/ecosystem level)
            - text: ": How AI influences digital marketplaces by governing information flows and enabling new forms of coordination between platform owners and complementors,"
        - paragraph [ref=f6e69]:
          - generic [ref=f6e70]:
            - text: 3).
            - emphasis [ref=f6e71]: AI-enabled Digital Entrepreneurship as Transformative Innovation Pathways (individual/venture level)
            - text: ": How generative AI lowers barriers to entry, strengthens founders’ ability to identify opportunities, and broadens who can successfully launch and grow new ventures,"
        - paragraph [ref=f6e72]:
          - generic [ref=f6e73]:
            - text: 4).
            - emphasis [ref=f6e74]: AI and Institutional Impact (e.g., from Media and Policy) on Digital Innovation Diffusion (societal level)
            - text: ": How institutional actors such as media and policymakers affect public attention to AI and guide the diffusion of AI-enabled innovation."
        - paragraph [ref=f6e75]: "He is also actively expanding his research into other topics related to emerging digital technologies, innovation, and labor markets, including:"
        - paragraph [ref=f6e76]: 5). Investment behavior and strategy in Bitcoin exchange and mining markets,
        - paragraph [ref=f6e77]: 6). Multihoming activities of workers in the gig economy,
        - paragraph [ref=f6e78]: 7). IT-enabled strategy and intervention for business in the area of employer brand management and referral program development.
        - paragraph [ref=f6e79]
        - paragraph [ref=f6e80]:
          - generic [ref=f6e81]:
            - text: Professor Lou’s research work has been published or forthcoming in premier academic journals such as
            - emphasis [ref=f6e82]: Management Science
            - text: ","
            - emphasis [ref=f6e83]: Information Systems Research
            - text: ", and"
            - emphasis [ref=f6e84]: Management Information Systems Quarterly
            - text: . His dissertation research on data analytics, AI, and innovation was awarded the INFORMS Information Systems Society (ISS) Nunamaker-Chen Best Dissertation Award (Winner) and ACM SIGMIS Dissertation Award (Runner-up). He is also a recipient of the INFORMS ISS Gordon B. Davis Young Scholar Award (Winner), Best IS paper in
            - emphasis [ref=f6e85]: Management Science
            - text: (Finalist), Best Paper Award (Finalist) at
            - emphasis [ref=f6e86]: Workshop on Information Systems and Economics
            - text: and
            - emphasis [ref=f6e87]: Conference on Information Systems and Technology
            - text: ", Best Paper Award (Runner-up) at INFORMS eBusiness, and Best Student Paper Award (Runner-up) at"
            - emphasis [ref=f6e88]: Conference on Health IT and Analytics
            - text: ", among other honors and research grants. He co-organizes and chairs the USC Marshall's"
            - emphasis [ref=f6e89]: AI in Management
            - text: (AIM)
            - emphasis [ref=f6e90]: c
            - text: onference, and previously co-organized and chaired the inaugural and second
            - emphasis [ref=f6e91]: Wharton Innovation Doctoral Symposium
            - text: (WINDS), the first multidisciplinary doctoral conference focused on innovation.
        - paragraph [ref=f6e92]
        - paragraph [ref=f6e93]: Prior to joining USC Marshall, he was an Assistant Professor of Operations and Information Management at the School of Business, University of Connecticut. He worked in technology and banking corporations including Intel and China Guangfa Bank. He was also a research programmer at Knowledge Lab of Computation Institute in Chicago, digging into an exciting field of computational social science.
        - paragraph [ref=f6e94]
        - paragraph [ref=f6e95]: Professor Lou received his Ph.D. in Operations, Information and Decisions (with a specific focus on information strategy & economics), and his M.A. in Statistics from the Wharton School, University of Pennsylvania. He also holds a M.S. in Computer Science from University of Chicago, and a B.Eng in Information Security from Shanghai Jiao Tong University. He is a data scientist, technology advisor and public speaker, frequently delivering his studies and innovation strategies related to emerging technologies.
        - paragraph [ref=f6e96]
        - paragraph [ref=f6e97]:
          - generic [ref=f6e98]:
            - text: Please contact at
            - emphasis [ref=f6e99]:
              - strong [ref=f6e100]: bowenlou at marshall dot usc dot edu
            - text: for academic-industry research collaboration, media inquiry, and speaking engagement.
